<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - NUVA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="logo-container">
      <img src="imagenes/nuva_tecnologia_logo.jpg" alt="Logo NUVA" id="logo">
      <h1>NUVA</h1>
    </div>

    <h3>Crea una cuenta</h3>

    <input type="text" id="nombre" placeholder="Nombre completo">
    <input type="email" id="correo" placeholder="Correo electrónico">
    <input type="password" id="contraseña" placeholder="Contraseña">
    <input type="date" id="fecha">

    <button id="btn-registrar">Registrarse</button><br>
    <a href="../login/login.html" class="inicia-sesión">¿Ya estás registrado? inicia sesión</a>

    <p id="mensaje"></p>

    <a href="../index.html" class="volver-principal">← Volver a Inicio</a>
  </div>

  <script src="script.js"></script>
</body>
</html>
